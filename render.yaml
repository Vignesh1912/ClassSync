services:
  - type: web
    name: classsync
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: INSFORGE_URL
        sync: false
      - key: INSFORGE_ANON_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
