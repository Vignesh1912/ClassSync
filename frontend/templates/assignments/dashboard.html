{% extends "dashboard/base.html" %}

{% block content %}
<div style="max-width: 960px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
        <h2 style="font-size:1.3rem;font-weight:700;margin:0;">Assignment Dashboard</h2>
        {% if current_user.role != 'admin' %}
        <a href="{{ url_for('assignment.create_assignment_page') }}"
           style="padding:.55rem 1.25rem;border-radius:8px;background:#3B5BFF;color:#fff;text-decoration:none;font-size:.88rem;font-weight:600;">
            + Create Assignment
        </a>
        {% endif %}
    </div>

    <div id="dash-loading" style="color:var(--text-light);font-size:.9rem;">Loading assignments…</div>
    <div id="dash-empty" style="display:none;text-align:center;color:var(--text-light);padding:3rem;background:#f8fafc;border-radius:12px;border:1px solid var(--border-color);">
        No assignments created yet. Click "Create Assignment" to get started.
    </div>
    <div id="dash-cards" style="display:none;flex-direction:column;gap:1.25rem;"></div>

    <!-- Submission modal -->
    <div id="sub-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center;">
        <div style="background:#fff;border-radius:12px;padding:1.75rem;max-width:650px;width:90%;max-height:80vh;overflow-y:auto;position:relative;">
            <button onclick="closeModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-light);">✕</button>
            <h3 id="modal-title" style="margin-bottom:1.25rem;font-size:1.1rem;font-weight:700;"></h3>
            <table style="width:100%;border-collapse:collapse;font-size:.88rem;">
                <thead>
                    <tr style="border-bottom:2px solid var(--border-color);">
                        <th style="padding:.6rem .8rem;text-align:left;font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.04em;">Student</th>
                        <th style="padding:.6rem .8rem;text-align:left;font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.04em;">User ID</th>
                        <th style="padding:.6rem .8rem;text-align:left;font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.04em;">Status</th>
                        <th style="padding:.6rem .8rem;text-align:left;font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.04em;">Submitted At</th>
                    </tr>
                </thead>
                <tbody id="modal-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('en-GB', {weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateTime(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

fetch('/api/assignments/list')
    .then(r => r.json())
    .then(data => {
        document.getElementById('dash-loading').style.display = 'none';
        if (!data.length) { document.getElementById('dash-empty').style.display = 'block'; return; }
        const container = document.getElementById('dash-cards');
        container.style.display = 'flex';
        data.forEach(a => {
            const submitted = a.submitted_count || 0;
            const total = a.total_students || 0;
            const pct = total > 0 ? Math.round(submitted / total * 100) : 0;
            const card = document.createElement('div');
            card.style.cssText = 'border:1px solid var(--border-color);border-radius:12px;padding:1.25rem;background:#fff;';
            card.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;">
                    <div>
                        <div style="font-weight:700;font-size:1rem;">${a.title}</div>
                        <div style="font-size:.82rem;color:var(--text-light);margin-top:3px;">${a.subject_name} · Due ${fmtDate(a.deadline)}</div>
                    </div>
                    <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;">
                        ${a.resource_path ? `<a href="/uploads/${a.resource_path}" target="_blank" style="padding:5px 12px;border-radius:8px;background:#f1f5f9;color:#475569;font-size:.78rem;font-weight:600;text-decoration:none;border:1px solid #e2e8f0;">📄 Download</a>` : ''}
                        <button onclick="viewSubmissions(${a.id}, '${a.title.replace(/'/g,'\\\'')}')"
                            style="padding:5px 14px;border-radius:8px;background:#3B5BFF;color:#fff;font-size:.78rem;font-weight:600;border:none;cursor:pointer;">
                            View Submissions
                        </button>
                    </div>
                </div>
                <div style="font-size:.82rem;color:var(--text-light);margin-bottom:.5rem;">
                    ${submitted} / ${total} students submitted
                </div>
                <div style="height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden;">
                    <div style="height:100%;width:${pct}%;background:#3B5BFF;border-radius:999px;transition:width .5s ease;"></div>
                </div>`;
            container.appendChild(card);
        });
    });

function viewSubmissions(assignmentId, title) {
    document.getElementById('modal-title').textContent = title + ' — Submissions';
    document.getElementById('modal-tbody').innerHTML = '<tr><td colspan="4" style="padding:1rem;color:var(--text-light);">Loading…</td></tr>';
    document.getElementById('sub-modal').style.display = 'flex';

    fetch('/api/assignments/submission-status/' + assignmentId)
        .then(r => r.json())
        .then(rows => {
            const tbody = document.getElementById('modal-tbody');
            tbody.innerHTML = '';
            rows.forEach(s => {
                const badge = s.status === 'submitted'
                    ? '<span style="font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0;">Submitted</span>'
                    : '<span style="font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:#ffedd5;color:#ea580c;border:1px solid #fed7aa;">Pending</span>';
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--border-color)';
                tr.innerHTML = `
                    <td style="padding:.65rem .8rem;">${s.student_name}</td>
                    <td style="padding:.65rem .8rem;color:var(--text-light);">${s.college_user_id}</td>
                    <td style="padding:.65rem .8rem;">${badge}</td>
                    <td style="padding:.65rem .8rem;color:var(--text-light);">${s.submitted_at ? new Date(s.submitted_at).toLocaleString('en-GB') : '—'}</td>`;
                tbody.appendChild(tr);
            });
        });
}

function closeModal() {
    document.getElementById('sub-modal').style.display = 'none';
}

document.getElementById('sub-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
</script>
{% endblock %}
